name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Application and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: services/yfinance/requirements.txt

      - name: Install dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci
          npm ci --prefix frontend
          python -m pip install -r services/yfinance/requirements.txt
          python -m pip check

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:web

      - name: Offline market-service tests
        run: npm run test:market

      - name: Install matching Chromium and system libraries
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('CHROME_EXECUTABLE=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Start isolated test PostgreSQL
        id: database
        run: npm run test:db:up

      - name: Backend unit and integration tests
        run: npm run test:foundation

      - name: Production build and browser workflows
        run: npm run test:e2e

      - name: Compose and nginx deployment tests
        run: npm run test:deploy

      - name: Show test database logs on failure
        if: ${{ failure() && steps.database.outcome != 'skipped' }}
        run: docker compose --project-name paper-foundation-test --env-file /dev/null -f apps/server/test/compose.yml logs --no-color

      - name: Stop isolated test PostgreSQL
        if: ${{ always() && steps.database.outcome != 'skipped' }}
        run: npm run test:db:down
